- name: Make Gradle wrapper executable
  working-directory: android
  run: chmod +x ./gradlew

- name: Build APK
  working-directory: android
  run: ./gradlew :app:assembleDebug --stacktrace

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: app-debug-apk
    path: android/app/build/outputs/apk/debug/app-debug.apk
